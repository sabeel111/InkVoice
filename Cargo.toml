[package]
name = "inkvoice"
version = "0.1.0"
edition = "2021"
description = "Lightweight dark-mode ebook reader that turns EPUB/PDF books into audiobooks with on-device voices"
repository = "https://github.com/sabeel111/InkVoice"
homepage = "https://sabeel111.github.io/InkVoice/"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
rfd = "0.15"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
epub = "2"
html2text = "0.14"
pdf-extract = "0.9"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["wgpu", "eframe"] }
